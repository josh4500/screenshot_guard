# Publishes to pub.dev when a version tag (e.g. v0.2.0) is pushed, using pub.dev's
# automated publishing: GitHub issues a short-lived OIDC token, so no credentials
# are stored in the repository.
#
# One-time setup on pub.dev: package Admin > Automated publishing > Enable
# publishing from GitHub Actions, repository `josh4500/screenshot_guard`, tag
# pattern `v{{version}}`.
#
# To release: bump `version` in pubspec.yaml (and ios/screenshot_shield.podspec),
# add a CHANGELOG entry, merge, then `git tag v<version> && git push origin v<version>`.
name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write # Required for pub.dev's OIDC authentication.
    steps:
      - uses: actions/checkout@v4

      # Configures the pub.dev OIDC token for `pub publish`.
      - uses: dart-lang/setup-dart@v1

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check the tag matches pubspec.yaml
        run: |
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Publish
        run: flutter pub publish --force
