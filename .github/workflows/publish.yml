name: Publish

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  publish:
    name: Bump, tag and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Bump version and update changelog
        run: |
          current="$(grep '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          case "${{ github.event.inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          new_version="$major.$minor.$patch"
          echo "new_version=$new_version" >> "$GITHUB_ENV"
          sed -i "s/^version: .*/version: $new_version/" pubspec.yaml

          last_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -n "$last_tag" ]; then
            notes="$(git log --oneline --no-merges "$last_tag"..HEAD | sed 's/^/* /')"
          else
            notes="* Release $new_version."
          fi
          { printf '## %s\n\n%s\n\n' "$new_version" "$notes"; cat CHANGELOG.md; } > /tmp/CHANGELOG.md
          mv /tmp/CHANGELOG.md CHANGELOG.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add pubspec.yaml CHANGELOG.md
          git commit -m "chore: release v${new_version}"
          git tag "v${new_version}"
          git push origin HEAD --tags

      - name: Publish to pub.dev
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "::error::PUB_CREDENTIALS secret is not set. See the workflow docs."
            exit 1
          fi
          mkdir -p "$HOME/.pub-cache"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          dart pub publish --force
