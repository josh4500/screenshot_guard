name: screenshot_shield
description: Detect screenshots and screen recording, blank screen captures of a whole screen or a sensitive region, and hide your app in the app switcher.
version: 0.2.0
repository: https://github.com/josh4500/screenshot_guard
issue_tracker: https://github.com/josh4500/screenshot_guard/issues

topics:
  - screenshot
  - screen-recording
  - security
  - privacy
  - screen-capture

screenshots:
  - description: The example app guarding a screen, with capture prevention, screenshot detection and recording status.
    path: doc/screenshots/android-demo.png

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ajibolaak.screenshot_shield
        pluginClass: ScreenshotShieldPlugin
      ios:
        pluginClass: ScreenshotShieldPlugin
      windows:
        pluginClass: ScreenshotShieldPluginCApi
      linux:
        pluginClass: ScreenshotShieldPlugin

platforms:
  android:
  ios:
  windows:
  linux:
