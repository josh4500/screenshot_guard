name: screenshot_shield
description: Detect user screenshots and optionally prevent screen capture on Android and iOS.
version: 0.1.1
repository: https://github.com/josh4500/screenshot_guard
homepage: https://github.com/josh4500/screenshot_guard

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.4"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.18.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.3.0

flutter:
  plugin:
    platforms:
      android:
        package: com.ajibolaak.screenshot_shield
        pluginClass: ScreenshotShieldPlugin
      ios:
        pluginClass: ScreenshotShieldPlugin

platforms:
  android:
  ios:
